name: Daily Pipeline Refresh
on:
  schedule:
    - cron: '0 5 * * *' # 6AM WAT daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python src/extract.py
      - run: python src/transform.py
      - run: python src/load.py
